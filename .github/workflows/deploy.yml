name: CI/CD Docker Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd /home/ec2-user/medium-2-docker-rds-cicd
          git fetch origin
          git reset --hard origin/main
          docker build -t medium-2-django .

      - name: Check Django
        run: |
          docker run --rm \
            --env-file /home/ec2-user/medium-2-docker-rds-cicd/.env \
            medium-2-django \
            python manage.py check

      - name: Deploy application
        run: |
          docker stop medium-2-container || true
          docker rm medium-2-container || true

          docker run -d \
            --name medium-2-container \
            --env-file /home/ec2-user/medium-2-docker-rds-cicd/.env \
            -p 8000:8000 \
            medium-2-django

      - name: Run migrations
        run: |
          docker exec medium-2-container python manage.py migrate

      - name: Verify deployment
        run: |
          sleep 3
          curl --fail http://127.0.0.1:8000/api/health/