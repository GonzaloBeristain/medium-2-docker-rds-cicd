name: CI/CD Docker Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Django check
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-only-secret-key"
          DJANGO_ALLOWED_HOSTS: "localhost"
          DB_NAME: "medium2db"
          DB_USER: "postgres"
          DB_PASSWORD: "ci-only-password"
          DB_HOST: "localhost"
          DB_PORT: "5432"
        run: |
          python3.11 -m venv .ci-venv
          source .ci-venv/bin/activate
          pip install -r requirements.txt
          python manage.py check

      - name: Deploy Docker application
        run: |
          cd /home/ec2-user/medium-2-docker-rds-cicd

          git fetch origin
          git reset --hard origin/main

          docker stop medium-2-container || true
          docker rm medium-2-container || true

          docker build -t medium-2-django .

          docker run -d \
            --name medium-2-container \
            --env-file .env \
            -p 8000:8000 \
            medium-2-django

          docker exec medium-2-container python manage.py migrate

      - name: Verify deployment
        run: |
          sleep 3
          curl --fail -H "Host: 3.235.193.21" http://127.0.0.1:8000/api/health/