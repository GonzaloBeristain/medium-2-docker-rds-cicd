name: CI/CD Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # -------------------------
      # CI - VALIDAR EL PROYECTO
      # -------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI virtual environment
        run: |
          python3.11 -m venv .ci-venv
          source .ci-venv/bin/activate
          pip install -r requirements.txt

      - name: Check Django
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-only-secret-key"
          DJANGO_ALLOWED_HOSTS: "localhost"
        run: |
          source .ci-venv/bin/activate
          python manage.py check

      # -------------------------
      # CD - DESPLEGAR EN EC2
      # -------------------------

      - name: Deploy application
        run: |
          cd /home/ec2-user/medium-1-ec2-cicd-deploy

          git fetch origin
          git reset --hard origin/main

          source venv/bin/activate
          pip install -r requirements.txt

          python manage.py check

          sudo systemctl restart medium-1

      - name: Verify deployment
        run: |
          sleep 2
          curl --fail -H "Host: 32.199.154.253" http://127.0.0.1/api/health/